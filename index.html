<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="책담(Chaekdam) 개인정보 보호 및 계정 관리 안내" />
  <title>책담 | 개인정보 보호 및 계정 관리</title>

  <style>
    :root {
      --bg: #f7f4ec;
      --surface: #fffdf8;
      --text: #292720;
      --sub: #6f6a5d;
      --line: #e3ded1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 0;
      color: var(--sub);
    }

    .card {
      display: block;
      margin-top: 20px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
    }

    .card:hover {
      border-color: #aaa38f;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 19px;
    }

    .card p {
      margin: 0;
      color: var(--sub);
    }

    footer {
      margin-top: 48px;
      color: var(--sub);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>책담</h1>
    <p class="subtitle">Chaekdam · Privacy & Account Information</p>

    <a class="card" href="./privacy.html">
      <h2>개인정보처리방침</h2>
      <p>책담이 이용자의 정보를 어떻게 처리하고 보호하는지 확인할 수 있습니다.</p>
    </a>

    <a class="card" href="./account-delete.html">
      <h2>계정 및 데이터 삭제</h2>
      <p>책담 계정과 관련 데이터의 삭제 방법을 확인하거나 삭제를 요청할 수 있습니다.</p>
    </a>

    <footer>
      © 2026 Chaekdam. All rights reserved.
    </footer>
  </main>
</body>
</html>
```
